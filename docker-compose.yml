version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: logicforge_postgres
    restart: always
    environment:
      POSTGRES_USER: logicforge_user
      POSTGRES_PASSWORD: logicforge_secure_password_2026
      POSTGRES_DB: logicforge_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logicforge_user -d logicforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logicforge_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://logicforge_user:logicforge_secure_password_2026@db:5432/logicforge_db
      - SECRET_KEY=prod-secret-key-change-this-in-production-64bytes
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-1.5-flash
      - GROQ_API_KEY=${GROQ_API_KEY:-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}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - SANDBOX_ENABLED=true
      - EXECUTION_TIMEOUT_SECONDS=5
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logicforge_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
